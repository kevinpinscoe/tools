name: Release check-git-repos

on:
  push:
    tags:
      - 'check-git-repos-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing check-git-repos-vX.Y.Z tag to (re)build packages for, e.g. to backfill apt/rpm'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Resolve tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#check-git-repos-v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0   # need full history + tags for release notes

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: check-git-repos-source/go.mod

      - name: Build binaries
        working-directory: check-git-repos-source
        run: |
          LDFLAGS="-s -w -X main.version=${VERSION}"
          GOOS=linux  GOARCH=amd64 go build -ldflags "$LDFLAGS" -o check-git-repos-linux-amd64  .
          GOOS=linux  GOARCH=arm64 go build -ldflags "$LDFLAGS" -o check-git-repos-linux-arm64  .
          GOOS=darwin GOARCH=arm64 go build -ldflags "$LDFLAGS" -o check-git-repos-darwin-arm64 .
          sha256sum \
            check-git-repos-linux-amd64 \
            check-git-repos-linux-arm64 \
            check-git-repos-darwin-arm64 \
            > checksums.txt

      - name: Install nfpm
        run: |
          NFPM_VER=2.47.0
          NFPM_TGZ="nfpm_${NFPM_VER}_Linux_x86_64.tar.gz"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VER}/checksums.txt" \
            -o "/tmp/nfpm_checksums.txt"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VER}/${NFPM_TGZ}" \
            -o "/tmp/${NFPM_TGZ}"
          (cd /tmp && grep "${NFPM_TGZ}$" nfpm_checksums.txt | sha256sum -c)
          sudo tar -xzf "/tmp/${NFPM_TGZ}" -C /usr/local/bin nfpm

      - name: Build .deb and .rpm packages
        working-directory: check-git-repos-source
        run: |
          for ARCH in amd64 arm64; do
            case "$ARCH" in
              amd64) RPMARCH=x86_64 ;;
              arm64) RPMARCH=aarch64 ;;
            esac
            cat > "nfpm-${ARCH}.yaml" <<EOF
          name: check-git-repos
          arch: ${ARCH}
          version: "${VERSION}"
          vendor: Kevin P. Inscoe
          homepage: https://github.com/kevinpinscoe/tools
          maintainer: "Kevin P. Inscoe <kevin.inscoe@gmail.com>"
          description: Scan git repositories under a root directory for ahead/behind/diverged/uncommitted state
          license: MIT
          contents:
            - src: ./check-git-repos-linux-${ARCH}
              dst: /usr/bin/check-git-repos
              file_info:
                mode: 0755
          EOF
            nfpm package --config "nfpm-${ARCH}.yaml" --packager deb \
              --target "check-git-repos_${VERSION}_${ARCH}.deb"
            nfpm package --config "nfpm-${ARCH}.yaml" --packager rpm \
              --target "check-git-repos-${VERSION}-1.${RPMARCH}.rpm"
          done

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums
        working-directory: check-git-repos-source
        run: |
          cosign sign-blob --yes \
            --bundle checksums.txt.bundle \
            checksums.txt

      - name: Build release notes
        run: |
          bash .github/release-notes.sh check-git-repos "$TAG" \
            | tee "${{ runner.temp }}/release-notes.md"

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.TAG }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            check-git-repos-source/check-git-repos-linux-amd64
            check-git-repos-source/check-git-repos-linux-arm64
            check-git-repos-source/check-git-repos-darwin-arm64
            check-git-repos-source/checksums.txt
            check-git-repos-source/checksums.txt.bundle
            check-git-repos-source/*.deb
            check-git-repos-source/*.rpm

      - name: Notify apt repo
        run: |
          gh api repos/kevinpinscoe/apt/dispatches \
            --method POST \
            --field event_type=new-release \
            --field client_payload[repo]="${{ github.repository }}" \
            --field client_payload[tag]="${{ env.TAG }}"
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}

      - name: Notify rpm repo
        run: |
          gh api repos/kevinpinscoe/rpm/dispatches \
            --method POST \
            --field event_type=new-release \
            --field client_payload[repo]="${{ github.repository }}" \
            --field client_payload[tag]="${{ env.TAG }}"
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}

      - name: Update Homebrew cask
        working-directory: check-git-repos-source
        run: |
          git clone "https://${HOMEBREW_TAP_TOKEN}@github.com/kevinpinscoe/homebrew-tap.git" /tmp/homebrew-tap
          python3 "${GITHUB_WORKSPACE}/.github/homebrew-cask.py" \
            --tool check-git-repos \
            --version "${VERSION}" \
            --tag "${TAG}" \
            --desc "Scan git repositories under a root directory for ahead/behind/diverged/uncommitted state"
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Casks/check-git-repos.rb"
          git diff --cached --quiet || git commit -m "check-git-repos ${VERSION}"
          git push
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
